[package]
name = "claude-sync"
version = "0.1.0"
description = "Sync Claude Code environments across machines"
authors = ["smrayyans"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "claude_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
notify = { version = "6", features = ["serde"] }
keyring = { version = "3", features = ["sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
