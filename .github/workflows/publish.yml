name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_name: linux
          - platform: windows-latest
            artifact_name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "claude-sync ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false

      - name: Copy Linux binary to npm package
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p npm/claude-sync-linux-x64/bin
          cp src-tauri/target/release/claude-sync npm/claude-sync-linux-x64/bin/claude-sync
          chmod +x npm/claude-sync-linux-x64/bin/claude-sync

      - name: Copy Windows binary to npm package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path npm/claude-sync-win32-x64/bin
          Copy-Item src-tauri/target/release/claude-sync.exe npm/claude-sync-win32-x64/bin/claude-sync.exe

      - name: Publish Linux npm package
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd npm/claude-sync-linux-x64
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Windows npm package
        if: matrix.platform == 'windows-latest'
        run: |
          cd npm/claude-sync-win32-x64
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish wrapper npm package (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd npm/claude-sync
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
